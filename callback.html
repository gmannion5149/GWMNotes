<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clio Connection</title>
</head>
<body>
  <h1>Clio Connection</h1>
  <p id="status">Receiving authorization from Clio...</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const error = params.get("error");

    if (error) {
      document.getElementById("status").textContent =
        "Clio authorization was not approved: " + error;
    } else if (code) {
      document.getElementById("status").textContent =
        "Clio authorization received successfully.";
      console.log("Authorization code received.");
    } else {
      document.getElementById("status").textContent =
        "No Clio authorization information was received.";
    }
  </script>
</body>
</html>
